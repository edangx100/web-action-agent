# Named model endpoints — the only place an endpoint is described.
#
# The agent never contains a base URL, a model name, or an API key. It asks for
# a profile by name (--profile openrouter) and gets back everything needed to
# talk to that endpoint. Running the same agent against a hosted aggregator, a
# first-party endpoint, or a laptop-local server is therefore a flag, not a
# code change — which is the claim this project has to be able to demonstrate.
#
# Each profile has:
#
#   base_url          OpenAI-compatible API root.
#   api_key_env       Name of the environment variable holding the key. The key
#                     itself is never written here — this file is committed.
#   api_key_required  False only where the server genuinely needs no key.
#   text              The route used when the planner sends DOM text alone.
#   vision            The route used when a screenshot is attached. Omitted
#                     (null) where the endpoint serves no vision model, which
#                     is what makes the screenshot channel unavailable rather
#                     than silently dropped.
#
# A route is a model plus two facts about how that model must be called:
#
#   model                  The model identifier the endpoint expects.
#   provider_order         Aggregators route one model to several hosts, which
#                          do not behave identically. Pinning the host is what
#                          makes a benchmark number reproducible three weeks
#                          later. Empty where the endpoint has one host anyway.
#   supports_json_schema   Whether the route honours schema-constrained
#                          decoding. Where it does not, the agent still asks
#                          the model for JSON in the prompt and the validator's
#                          schema check plus bounded retry is the safety net.
#
# Model choice: the planner is Nemotron 3 Nano throughout — a small
# open-weight model, so the local profile serves the same weights as the hosted
# ones. Observations carrying a screenshot go to a vision-language model: on
# the first-party profile, Nano's own Omni sibling; on OpenRouter, Nemotron 3.5
# Super VL, because there Omni is offered only on an unreliable free tier.

openrouter:
  # Primary development path: one key, many models, easy comparison sweeps.
  base_url: https://openrouter.ai/api/v1
  api_key_env: WAA_OPENROUTER_API_KEY
  api_key_required: true
  text:
    model: nvidia/nemotron-3-nano-30b-a3b
    # Of the hosts serving this model, Nebius is the one supporting
    # structured_outputs -- strict, schema-constrained replies -- so pinning it
    # buys reproducibility and schema-constrained decoding in the same stroke.
    # Supporting `response_format` alone is not enough: OpenRouter drops any
    # host without structured_outputs from a request carrying a strict schema,
    # and with fallback off that leaves no host at all. (Checked 2026-10-18 in
    # OpenRouter's endpoint list: Novita lists response_format only.)
    provider_order: [Nebius]
    supports_json_schema: true
  vision:
    # Not Nano's Omni sibling: on OpenRouter that is offered only as a free
    # endpoint (the paid listing has no host), and a live rehearsal showed why
    # that will not do for published results -- empty replies under load, no
    # schema support so its actions were often malformed, and no price, so
    # its calls could not be counted. Super VL is the paid NVIDIA vision model
    # with hosts that support structured_outputs; DeepInfra is pinned for its
    # uptime. (Checked 2026-10-18 in OpenRouter's endpoint list.)
    model: nvidia/nemotron-3.5-super-vl
    provider_order: [DeepInfra]
    supports_json_schema: true

nvidia:
  # First-party fallback: fewer models, but one vendor, no routing layer, and
  # therefore nothing to pin. Where the aggregator misbehaves, this arbitrates.
  base_url: https://integrate.api.nvidia.com/v1
  api_key_env: WAA_NVIDIA_API_KEY
  api_key_required: true
  text:
    model: nvidia/nemotron-3-nano-30b-a3b
    provider_order: []
    supports_json_schema: true
  vision:
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    provider_order: []
    supports_json_schema: true

local:
  # Self-hosted vLLM. A server usually serves exactly one model, so there is no
  # vision route: with this profile the screenshot channel reports itself
  # unavailable instead of quietly sending images the model cannot read.
  base_url: http://127.0.0.1:8000/v1
  api_key_env: WAA_LOCAL_API_KEY
  api_key_required: false
  text:
    model: nvidia/nemotron-3-nano-30b-a3b
    provider_order: []
    supports_json_schema: true
  vision: null

# --- Comparison models ---------------------------------------------------------
#
# Two more open-weight models, for the multi-model comparison: the same
# benchmark, the same code, only --profile changed. Both are on the same
# aggregator and key as `openrouter`, so the comparison is between models, not
# between services.
#
# Each reads screenshots itself, so one model serves both routes: the arm then
# measures that model alone, rather than a mix of it and Nemotron's vision
# model. Neither is from the judge's family (google/gemini), which the program
# checks at start.

openrouter-qwen:
  # Qwen 3.6 35B-A3B (Alibaba, open weights): the closest match in size to
  # Nemotron 3 Nano -- 35 billion parameters, 3 billion active per token.
  # DeepInfra is pinned: it supports structured_outputs, and it already hosts
  # the primary profile's vision model. (Checked 2026-10-19 in OpenRouter's
  # endpoint list.)
  base_url: https://openrouter.ai/api/v1
  api_key_env: WAA_OPENROUTER_API_KEY
  api_key_required: true
  text:
    model: qwen/qwen3.6-35b-a3b
    provider_order: [DeepInfra]
    supports_json_schema: true
  vision:
    model: qwen/qwen3.6-35b-a3b
    provider_order: [DeepInfra]
    supports_json_schema: true

openrouter-glimmer:
  # Muse Glimmer 30B (Meta, open weights): a third maker, at the same size as
  # the other two -- 30 billion parameters, dense -- and built for agents.
  # DeepInfra is pinned: it supports structured_outputs and had full uptime.
  # (Checked 2026-10-19 in OpenRouter's endpoint list.)
  #
  # Not Mistral Small 4, which was tried first: OpenRouter serves it through
  # one account shared by all its users, and that account stayed over
  # Mistral's request limit for hours, turning every run away.
  base_url: https://openrouter.ai/api/v1
  api_key_env: WAA_OPENROUTER_API_KEY
  api_key_required: true
  text:
    model: meta/muse-glimmer-30b
    provider_order: [DeepInfra]
    supports_json_schema: true
  vision:
    model: meta/muse-glimmer-30b
    provider_order: [DeepInfra]
    supports_json_schema: true

openrouter-judge:
  # The evaluation judge, not a planner. It marks the agent's runs, so it must
  # come from a different family of models than the planner above -- a model
  # is more likely to accept an answer that looks like its own -- and the
  # program refuses to start if it does not. It must also be stronger, and it
  # must read screenshots, because the final page is the evidence.
  #
  # Gemini 3.8 Flash: a different vendor and line (google/gemini, against
  # nvidia/nemotron), reads images, and honours both temperature 0 and
  # schema-constrained answers on the Google AI Studio host, which is why that
  # host is pinned. Several Claude models were also considered; on this
  # aggregator they do not accept a temperature setting, and the judge must run
  # at temperature 0 so that a verdict can be recomputed.
  #
  # Uses the same OpenRouter key as the planner: no second account.
  base_url: https://openrouter.ai/api/v1
  api_key_env: WAA_OPENROUTER_API_KEY
  api_key_required: true
  text:
    model: google/gemini-3.8-flash
    provider_order: [Google AI Studio]
    supports_json_schema: true
  vision:
    model: google/gemini-3.8-flash
    provider_order: [Google AI Studio]
    supports_json_schema: true
