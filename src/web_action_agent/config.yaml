# Committed defaults for every tunable the agent has.
#
# Configuration resolves in three layers, lowest precedence first:
#
#     config.yaml  ->  .env / environment  ->  command-line flags
#
# This file is the bottom layer: the project's declared defaults, the same for
# everyone who checks the repository out. Machine-local changes belong in .env
# (which is git-ignored), and per-run changes belong on the command line.
#
# Every setting here can also be set as WAA_<NAME_IN_CAPITALS> in .env, or as
# --name-with-hyphens on the command line. See .env.example for the full list.
#
# Secrets are not settings and never appear here: no API key is read from this
# file, and writing one in would be rejected as an unknown key. Keys live in
# .env alone.
#
# An unrecognised key here is an error rather than a silent default, so a
# mistyped setting stops the run instead of quietly changing nothing.

# --- Model endpoint ----------------------------------------------------------

# Which named endpoint every model call goes to. The endpoints themselves —
# base URLs, model names, which variable holds each key — are described in
# profiles.yaml. This setting picks one of them: openrouter, nvidia, or local.
profile: openrouter

# The evaluation judge: a second, stronger model that marks benchmark runs
# whose answer plain code cannot check. Left empty, there is no judge: running
# a task never needs one, and nothing spends money on judging unless asked.
# Set it (here, or as WAA_JUDGE_PROFILE in .env) to mark a benchmark or to let
# `waa induce` check candidate skills with a second model. It must come from a
# different family of models than the planner's profile -- the agent is not
# marked by its own kind -- and the program refuses to start otherwise.
# openrouter-judge is provided: Gemini 3.8 Flash, on the same OpenRouter key.
judge_profile:

# Ad-hoc overrides of the selected profile, for cases profiles.yaml cannot
# anticipate: a self-hosted server on another host, or one run against a
# different model. Left empty, the profile's own values stand.
base_url:
model:

# --- Run ---------------------------------------------------------------------

# The page an ad-hoc `waa run "<task>"` opens on, when --start-url is not
# given. The agent never starts on a blank page and guesses an address, so
# there is always a default here; benchmark tasks name their own start URL and
# ignore this one.
#
# Wikipedia is the default because it is public, read-only, needs no login,
# and is a reasonable place to begin almost any "find out X" task. The start
# URL also fixes which sites the run may visit, so this is a safety-relevant
# default, not just a convenience.
start_url: https://en.wikipedia.org/

# --- Agent loop --------------------------------------------------------------

# Hard cap on steps in one run. The loop's guarantee that it terminates.
max_steps: 25

# How many recent steps the planner sees word for word. Older steps are not
# dropped: they are folded into a running notepad -- the same line while there
# is room, then counted -- so what was typed and where the agent went survive
# however long the run goes on. Kept small, because the page in front of the
# agent is what the next decision is about, and a long transcript buries it.
history_window: 5

# How many times one step may be re-planned after the validator rejects the
# action, before the step is recorded as failed.
retry_budget: 2

# Screenshots cost tokens, so they reach the planner only when the DOM signal
# looks too weak to act on. These two thresholds are that judgement: too few
# interactive elements extracted from the page, or repeated planner failures on
# DOM-only input.
screenshot_min_elements: 5
screenshot_max_dom_failures: 2

# Truncation budget, in tokens, for the distilled page-text extract that
# accompanies every observation.
text_token_budget: 1500

# --- Browser -----------------------------------------------------------------

# Show the browser window while the agent drives it. Off by default: a run has
# to work over SSH and in CI, where there is no screen to draw on. `--headed`
# turns it on for one run, which is what the demo recording uses.
headed: false

# Fixed viewport. Element extraction is viewport-only and the annotated
# screenshot is numbered to match, so changing this changes what the agent can
# see in one observation, not merely how the page is drawn.
viewport_width: 1280
viewport_height: 800

# --- Politeness --------------------------------------------------------------
#
# How the agent behaves towards somebody else's server. All three of these can
# be relaxed, and relaxing them is a decision rather than a default.

# Minimum seconds between navigations to the same site, enforced across every
# worker on this machine rather than per worker -- four workers each waiting a
# second still make four requests a second at the site.
domain_delay_s: 1.0

# What the browser tells every site it is. Deliberately not a copy of a real
# Chrome string: a tool that pretends to be a person cannot then object to
# being treated as one, and results that depend on impersonation are not
# results. A fork or a deployment should say what it is here.
user_agent: WebActionAgent/0.0.1 (+https://github.com/edangx100/web-action-agent)

# Read each site's robots.txt and refuse the paths it asks automated visitors
# to leave alone. The refusal happens in the validator, before the browser is
# asked -- fetching a page and then discarding it is the thing the file exists
# to prevent.
respect_robots: true

# Domains the navigation allowlist accepts in addition to the start URL's own
# registrable domain, which is always allowed and never needs listing. In .env
# the same setting is one comma-separated string.
allowlist_extra: []

# --- Timeouts, in seconds ----------------------------------------------------
#
# Each expiry is reported as a categorized failure with its reason, never an
# exception that ends a run without a verdict.

action_timeout_s: 30.0    # one browser action
llm_timeout_s: 90.0       # one model call
run_timeout_s: 300.0      # one whole run, wall clock

# --- How long a model's reply may be -------------------------------------------
#
# The longest reply one model call may write, in tokens. A model can get stuck
# writing the same thing over and over: one wrote 61,000 tokens over thirteen
# minutes for a step whose answer is a few hundred. This limit stops it at the
# host, which reports what was written, so the call is still counted and paid
# for at its true size. A reply cut short this way fails to parse and is asked
# for again, like any other unusable reply.
#
# Set well above what a working reply needs: in the published runs, 99 in 100
# replies were under 5,700 tokens, and the longest was 9,484.
llm_max_output_tokens: 8192

# --- When the AI service says you are going too fast -------------------------
#
# An endpoint answering "too many requests" is not a broken endpoint, and the
# designed response is to wait and ask again, waiting longer each time. Bounded,
# because the point is to end: after the last attempt the call fails with a
# stated reason, which a results table can hold.
#
# This is deliberately not the validator's retry budget. That one counts *bad
# answers* from the model; this one counts *refusals* from the service, and
# merging them would make each look like the other.

backoff_attempts: 4       # tries per call, the first included: 4 means 3 waits
backoff_base_s: 1.0       # first pause; each one after it doubles
backoff_max_s: 30.0       # longest single pause

# --- Skill library -----------------------------------------------------------

# Skills whose success rate falls below this are retired automatically; this is
# how the library sheds skills that site drift has broken.
skill_retirement_rate: 0.70

# Recorded uses required before retirement can trigger, so that one unlucky
# replay cannot retire a skill that works.
skill_retirement_min_sample: 5

# --- Evaluation harness ------------------------------------------------------

# Benchmark tasks run in parallel.
workers: 4

# Ceilings for one evaluation sweep. Whichever is reached first stops the sweep.
budget_usd: 15.0
budget_hours: 6.0

# Hand-labelled trials an agreement figure (machine marks vs a person's)
# should rest on before it is relied on. Fewer are still reported in the
# results tables, with how many there were and a warning.
agreement_min_labels: 20
