# What a thousand thousand tokens cost, by profile and by model.
#
# Checked in on purpose. A run's dollar figure has to be reproducible by
# whoever reads the results months later, and a price fetched from a provider's
# API at run time is a number nobody can check afterwards — the page will have
# changed. So the prices live here, in the repository, with the date each was
# last verified, and a published result can name the file it was priced under.
#
# --- The rules ---------------------------------------------------------------
#
# 1. Prices are US dollars per *million* tokens, which is how providers quote
#    them. Input and output are priced separately, because they almost always
#    differ by a factor of three or four.
#
# 2. An empty price means UNKNOWN, and unknown is recorded as unknown — never
#    as zero. Zero is a claim, and a false zero quietly corrupts every total
#    that includes it: one unpriced model in a benchmark makes the whole
#    cost-per-task column wrong in the flattering direction.
#
# 3. A free route is also left empty. A free tier is a promotional arrangement
#    with a rate limit, not a price, and writing 0.0 would let a comparison
#    claim a cost saving that came from somebody's promotion.
#
# 4. The key is the profile AND the model. The same open-weight model is served
#    here by an aggregator, by its vendor, and by a server on your own machine,
#    at three different prices — and the last of those has no per-token price
#    at all. A table keyed on the model name alone would bill a self-hosted run
#    for tokens that cost nothing.
#
# --- Before you publish a number ---------------------------------------------
#
# Fill in the prices below from each provider's own pricing page and put the
# date in `checked`. Until then the agent records tokens and wall-clock — which
# are always true — and reports dollars as unknown, which is also true. A stale
# price is worse than no price: no price is visibly missing, and a stale one
# looks like an answer.

openrouter:
  # Aggregator. Prices vary by the host serving the model, and this project
  # pins one host per route, so the price to copy here is that host's.
  nvidia/nemotron-3-nano-30b-a3b:
    input_usd_per_mtok: 0.06
    output_usd_per_mtok: 0.24
    checked: "2026-10-18"
    note: planner text route; the pinned Nebius host, from OpenRouter's endpoint list

  nvidia/nemotron-3.5-super-vl:
    input_usd_per_mtok: 0.10
    output_usd_per_mtok: 0.40
    checked: "2026-10-18"
    note: planner vision route; the pinned DeepInfra host, from OpenRouter's endpoint list

openrouter-text:
  # The primary profile without a vision route: the same pinned host and price.
  nvidia/nemotron-3-nano-30b-a3b:
    input_usd_per_mtok: 0.06
    output_usd_per_mtok: 0.24
    checked: "2026-10-18"
    note: planner text route; the pinned Nebius host, as for openrouter

openrouter-qwen:
  # Comparison model; one model serves both routes.
  qwen/qwen3.6-35b-a3b:
    input_usd_per_mtok: 0.10
    output_usd_per_mtok: 0.95
    checked: "2026-10-19"
    note: the pinned DeepInfra host, from OpenRouter's endpoint list

openrouter-glimmer:
  # Comparison model; one model serves both routes.
  meta/muse-glimmer-30b:
    input_usd_per_mtok: 0.30
    output_usd_per_mtok: 1.20
    checked: "2026-10-19"
    note: the pinned DeepInfra host, from OpenRouter's endpoint list

openrouter-judge:
  # The evaluation judge. Price of the pinned Google AI Studio host, as listed
  # by OpenRouter's endpoint list for this model. Images are billed as input
  # tokens at the same rate.
  google/gemini-3.8-flash:
    input_usd_per_mtok: 0.75
    output_usd_per_mtok: 3.75
    checked: "2026-10-10"
    note: judge; Google AI Studio standard tier (not flex or priority)

nvidia:
  # First-party endpoint. Calls are made under the service's free trial
  # access, which is limited by request rate, not paid per token -- a trial
  # arrangement, not a price -- so, by rule 3 above, left empty: the arm's
  # dollars read "unknown".
  nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:
    input_usd_per_mtok:
    output_usd_per_mtok:
    checked:
    note: first-party; serves both the text and the vision route

local:
  # Self-hosted vLLM on your own hardware. There is no per-token price here at
  # all: the cost is electricity and the machine, neither of which divides
  # sensibly by a token. Tokens and wall-clock are the cost measure for this
  # profile, which is what the spec asks for, and dollars stay unknown.
  nvidia/nemotron-3-nano-30b-a3b:
    input_usd_per_mtok:
    output_usd_per_mtok:
    checked:
    note: self-hosted — tokens and wall-clock are the cost measure
