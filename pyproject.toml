[project]
name = "web-action-agent"
version = "0.0.1"
description = "A self-improving multimodal web action agent"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "playwright>=1.47",
    "openai>=1.40",
    "pydantic>=2.8",
    "pillow>=10.4",
    "typer>=0.12",
    "pyyaml>=6.0",
    "publicsuffixlist>=1.0",
]

[project.scripts]
web-action-agent = "web_action_agent.cli:main"
waa = "web_action_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_action_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test declares exactly one of these, and `tests/conftest.py` fails the
# run if one does not. The marker is what lets continuous integration select
# the offline suite by name, instead of guessing which test needs a network or
# an API key.
markers = [
    "unit: pure Python, no browser and no network",
    "fixture: runs against the local static fixture site",
    "mock_llm: uses stubbed or recorded model responses",
    "live: needs the real web or a real model endpoint; excluded from CI",
]
addopts = [
    "--strict-markers",  # A mistyped marker is an error, not a silent no-op.
    "--strict-config",   # Likewise for an unknown key in this table.
    "-ra",               # Summarise every non-passing outcome at the end.
    "-m",
    "not live",          # A bare `pytest` stays offline; CI passes its own -m.
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
